name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: zk-ui-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zk-ui-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zk-ui-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zk-ui-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Linux: create .tar.gz ──
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/zk-ui package/
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .

      # ── macOS: create .dmg ──
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/zk-ui.app/Contents/MacOS
          mkdir -p build/zk-ui.app/Contents/Resources
          cp target/${{ matrix.target }}/release/zk-ui build/zk-ui.app/Contents/MacOS/
          cp Info.plist build/zk-ui.app/Contents/
          cp icons/zk-ui.icns build/zk-ui.app/Contents/Resources/
          mkdir -p dmg_staging
          cp -r build/zk-ui.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "zk-ui" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            ${{ matrix.artifact }}.dmg

      # ── Windows: create .zip ──
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target/${{ matrix.target }}/release/zk-ui.exe package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.dmg
            *.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
